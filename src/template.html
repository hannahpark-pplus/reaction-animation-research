<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Animation Research — Motion Spec</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeeea;
  --border: #dcdad4;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --series-1: #2a78d6;
  --series-1-soft: #cde2fb;
  --ref: #9a9993;
  --accent: #0b0b0b;
  --hi: #e34948;
  --ok: #0ca30c; --warn: #b07800; --low: #d03b3b;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-1-soft: #184f95; --ref: #77766f; --accent: #fff; --hi: #e66767;
    --warn: #c98500;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #383835;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --series-1: #3987e5; --series-1-soft: #184f95; --ref: #77766f; --accent: #fff; --hi: #e66767;
  --warn: #c98500;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .sub { color: var(--text-muted); font-size: 12px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav button, .chip { border: 1px solid var(--border); background: var(--surface-1); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; }
nav button[aria-pressed="true"] { background: var(--accent); color: var(--surface-1); border-color: var(--accent); }
#themeBtn { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
main { padding: 20px 24px 60px; max-width: 1500px; margin: 0 auto; }
.muted { color: var(--text-muted); }
.sec { color: var(--text-secondary); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0 0 8px; }
h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 14px 0 6px; font-weight: 600; }

/* App view */
.app-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .app-grid { grid-template-columns: 1fr; } }
.player { position: sticky; top: 80px; }
.phone { background: #000; border-radius: 28px; padding: 8px; width: fit-content; margin: 0 auto; }
.phone video { height: calc(100vh - 250px); min-height: 360px; max-width: 100%; display: block; border-radius: 22px; aspect-ratio: 1290/2796; background:#000; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.controls button { border: 1px solid var(--border); background: var(--surface-1); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--accent); color: var(--surface-1); }
.readout { font-family: var(--mono); font-size: 13px; margin-top: 8px; display: flex; justify-content: space-between; }
.kbd { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

.timeline { position: relative; user-select: none; }
.tl-svg { width: 100%; display: block; overflow: visible; cursor: pointer; }
.tl-svg text { font-size: 11px; fill: var(--text-secondary); }
.tl-svg .grid { stroke: var(--border); stroke-width: 1; }
.tl-svg .bar { fill: var(--series-1); rx: 4; }
.tl-svg .bar.dim { fill: var(--series-1-soft); }
.tl-svg .marker { stroke: var(--hi); stroke-width: 2; }
.tl-svg .playhead { stroke: var(--text-primary); stroke-width: 1.5; }
.tl-svg .row:hover .bar { filter: brightness(1.15); }
.tl-svg .lbl { fill: var(--text-primary); font-size: 12px; }

.summary { font-size: 15px; color: var(--text-secondary); max-width: 80ch; margin: 6px 0 14px; }
.kv { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
.kv div b { display: block; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kv div span { font-size: 12px; color: var(--text-muted); }

.anims { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 14px; margin-top: 14px; }
.anim h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; font-weight: 600; }
.badge.high { color: var(--ok); } .badge.medium { color: var(--warn); } .badge.low { color: var(--low); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 4px; }
.stats div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.stats b { display: block; font-family: var(--mono); font-size: 15px; }
.stats span { font-size: 11px; color: var(--text-muted); }
.easing { white-space: pre-line; font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin-top: 6px; word-break: break-all; }
.row-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.row-btns button { border: 1px solid var(--border); background: var(--surface-1); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.row-btns button:hover { border-color: var(--text-secondary); }
.viz-pair { display: grid; grid-template-columns: 1fr 140px; gap: 10px; margin-top: 10px; align-items: stretch; }
.chart svg { width: 100%; display: block; overflow: visible; }
.chart svg text { font-size: 10px; fill: var(--text-muted); }
.chart .axis { stroke: var(--border); }
.chart .meas { fill: none; stroke: var(--series-1); stroke-width: 2; }
.chart .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.chart .fit { fill: none; stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 4 3; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 4px; }
.legend i.fit { border-top: 1.5px dashed var(--ref); }
.replica { background: var(--surface-2); border-radius: 10px; position: relative; overflow: hidden; min-height: 140px; display:flex; align-items:center; justify-content:center; }
.replica .shape { width: 44px; height: 44px; border-radius: 50%; background: var(--series-1); display:flex; align-items:center; justify-content:center; color:#fff; font-size: 20px; }
.replica .cap { position: absolute; bottom: 4px; left: 6px; right: 6px; font-size: 10px; color: var(--text-muted); text-align: center; }
.notes { font-size: 12.5px; color: var(--text-secondary); margin-top: 8px; }
.gallery { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.gallery figure { margin: 0; flex: 0 0 auto; max-width: 260px; cursor: pointer; }
.gallery img { max-height: 260px; max-width: 260px; border-radius: 8px; border: 1px solid var(--border); display: block; }
.gallery figcaption { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
ul.tight { margin: 4px 0; padding-left: 18px; } ul.tight li { margin: 3px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 1200px) { .two { grid-template-columns: 1fr; } }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 50; display: none; max-width: 280px; }
.tip b { font-family: var(--mono); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--surface-1); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.ov-table td, .ov-table th { white-space: nowrap; }
.ov-table tr.click { cursor: pointer; } .ov-table tr.click:hover td { background: var(--surface-2); }
.method { font-size: 13px; color: var(--text-secondary); }
.method li { margin: 4px 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Reaction Animation Research — Motion Spec</h1>
    <div class="sub">Measured frame-by-frame from 60 fps iPhone screen recordings · units: pt (1 pt = 3 px) and ms</div>
  </div>
  <nav id="nav"></nav>
  <button id="themeBtn" title="Toggle light/dark">◐</button>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const DATA = /*DATA*/[];
const FPS = 60;

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const S = (tag, attrs = {}) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
const fmt = (v, d = 0) => v == null || v === "" ? "—" : (typeof v === "number" ? (Number.isInteger(v) && d === 0 ? String(v) : v.toFixed(d).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1")) : String(v));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block"; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.style.display = "none"; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); }

// theme
$("#themeBtn").onclick = () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

// derived metrics
function animsOf(d) { return (d.animations || []).filter(a => a.start_s != null); }
function triggerT(d) {
  const c = d.representative_cycle || {}; const ints = (d.interactions || []).filter(i => i.t >= (c.start ?? -1) && i.t <= (c.end ?? 1e9));
  return ints.length ? ints[0].t : (c.start ?? 0);
}
function cycleMetrics(d) {
  const c = d.representative_cycle || {};
  const isLoop = a => a.loop_period_ms || /idle|loop/i.test(a.id + " " + a.name);
  const isUndo = a => /\b(unlike|un-like|remove|unreact)/i.test(a.id + " " + a.name);
  const as = animsOf(d).filter(a => a.start_s >= (c.start ?? -1) - 0.05 && a.start_s <= (c.end ?? 1e9) + 0.05 && !isLoop(a) && !isUndo(a));
  if (!as.length) return {};
  const t0 = triggerT(d);
  const first = Math.min(...as.map(a => a.start_s)), last = Math.max(...as.map(a => a.end_s ?? a.start_s + (a.duration_ms || 0) / 1000));
  const peaks = (d.animations || []).flatMap(a => (a.properties || []).filter(p => /scale/i.test(p.prop) && typeof p.peak === "number" && typeof p.to === "number" && p.to)
    .map(p => (p.peak / p.to - 1) * 100));
  return { t0, first, last, total: Math.round((last - first) * 1000), count: (d.animations || []).length,
    longest: Math.max(...(d.animations || []).filter(a => !isLoop(a)).map(a => a.duration_ms || 0)), overshoot: peaks.length ? Math.max(...peaks) : null };
}

// ---------- NAV ----------
let current = location.hash.slice(1) || "overview";
function renderNav() {
  const nav = $("#nav"); nav.innerHTML = "";
  const items = [["overview", "Overview"], ...DATA.map(d => [d.id, d.app])];
  for (const [id, label] of items) nav.append(h("button", { "aria-pressed": String(id === current), onclick: () => go(id) }, label));
}
function go(id) { current = id; location.hash = id; renderNav(); render(); scrollTo(0, 0); }
addEventListener("hashchange", () => { const id = location.hash.slice(1) || "overview"; if (id !== current) { current = id; renderNav(); render(); } });

function render() {
  const main = $("#main"); main.innerHTML = "";
  if (current === "overview" || !DATA.find(d => d.id === current)) renderOverview(main); else renderApp(main, DATA.find(d => d.id === current));
}

// ---------- OVERVIEW ----------
function renderOverview(main) {
  main.append(h("h2", {}, "Overview"));
  main.append(h("p", { class: "summary" }, `${DATA.length} apps · ${DATA.reduce((s, d) => s + (d.animations || []).length, 0)} measured animation phases. Click an app to scrub its recording frame-by-frame next to the spec. "Delay" on each phase is measured from the touch that triggers that phase (e.g. the selection tap for a fly-out), not from the start of the cycle.`));

  const rows = DATA.map(d => ({ d, m: cycleMetrics(d) }));
  // bar chart: trigger → settled
  const card = h("div", { class: "card" }, h("h3", {}, "Motion span of one full reaction cycle (ms)"), h("p", { class: "muted", style: "margin:-4px 0 8px;font-size:12px" }, "First animated phase starting → last phase settling, in each app's representative cycle (open picker → select → settle where the app has a picker). Idle emoji loops and unlike/remove phases excluded."));
  card.append(barChart(rows.filter(r => r.m.total).map(r => ({ label: r.d.app, value: r.m.total, id: r.d.id, sub: r.d.trigger }))));
  main.append(card);

  const t = h("table", { class: "ov-table" });
  t.append(h("thead", {}, h("tr", {}, ...["App", "Trigger", "Phases", "Motion span (cycle)", "Longest phase", "Max scale peak vs. rest"].map((x, i) => h("th", { class: i > 1 ? "num" : "" }, x)))));
  const tb = h("tbody");
  for (const { d, m } of rows) tb.append(h("tr", { class: "click", onclick: () => go(d.id) },
    h("td", {}, h("b", {}, d.app)), h("td", { class: "sec", style: "white-space:normal;max-width:360px" }, d.trigger || "—"),
    h("td", { class: "num" }, fmt(m.count)),
    h("td", { class: "num" }, m.total ? m.total + " ms" : "—"), h("td", { class: "num" }, m.longest ? m.longest + " ms" : "—"),
    h("td", { class: "num" }, m.overshoot != null ? "+" + m.overshoot.toFixed(0) + "%" : "—")));
  t.append(tb);
  main.append(h("div", { class: "card", style: "margin-top:14px;overflow-x:auto" }, h("h3", { style: "display:flex;justify-content:space-between" }, "Comparison table", h("span", {}, h("button", { class: "chip", onclick: exportCSV }, "Download all phases (CSV)"), " ", h("button", { class: "chip", onclick: exportJSON }, "Download JSON"))), t));

  main.append(h("div", { class: "card method", style: "margin-top:14px" }, h("h3", {}, "How these numbers were measured"), h("ul", { class: "tight", html: `
    <li>Each recording was decoded at its native ~60 fps (one frame ≈ 16.7 ms). Timings are frame-accurate to ±1 frame (±17 ms).</li>
    <li>Sizes/positions are converted from the 1290×2796 px recording to iOS points (÷3), so they drop straight into a 430×932 pt artboard.</li>
    <li>Motion was located with frame differencing; element bounds/centroids were tracked per frame with pixel masks, then normalized to fit an easing curve.</li>
    <li>Easing values are <i>fits</i> to the measured samples (dashed line vs. measured line in each card) — treat them as a starting point to tune by eye.</li>
    <li>Confidence badges: <b>high</b> = directly measured; <b>medium</b> = measured but partly occluded or few frames; <b>low</b> = inferred.</li>`})));
}
function barChart(items) {
  const W = 900, rowH = 30, L = 110, R = 70, H = items.length * rowH + 24;
  const max = Math.max(...items.map(i => i.value)) * 1.05;
  const svg = S("svg", { viewBox: `0 0 ${W} ${H}`, class: "tl-svg" });
  const x = v => L + (W - L - R) * v / max;
  const step = max > 2000 ? 500 : 250;
  for (let v = 0; v <= max; v += step) { svg.append(S("line", { x1: x(v), x2: x(v), y1: 0, y2: H - 20, class: "grid" })); const t = S("text", { x: x(v), y: H - 6, "text-anchor": "middle" }); t.textContent = v; svg.append(t); }
  items.sort((a, b) => b.value - a.value).forEach((it, i) => {
    const y = i * rowH + 4; const g = S("g", { class: "row" });
    const lab = S("text", { x: L - 8, y: y + 15, "text-anchor": "end", class: "lbl" }); lab.textContent = it.label;
    const r = S("rect", { x: L, y: y + 4, width: Math.max(2, x(it.value) - L), height: 16, class: "bar", rx: 4 });
    const v = S("text", { x: x(it.value) + 6, y: y + 16 }); v.textContent = it.value + " ms";
    const hit = S("rect", { x: 0, y, width: W, height: rowH, fill: "transparent" });
    hit.addEventListener("mousemove", e => showTip(e, `<b>${esc(it.label)}</b><br>${it.value} ms trigger → settled<br><span class="muted">${esc(it.sub || "")}</span>`));
    hit.addEventListener("mouseleave", hideTip); hit.addEventListener("click", () => { hideTip(); go(it.id); }); hit.style.cursor = "pointer";
    g.append(lab, r, v, hit); svg.append(g);
  });
  return svg;
}
function rowsForExport() {
  const out = [];
  for (const d of DATA) for (const a of d.animations || []) {
    const props = (a.properties || []).map(p => `${p.prop}: ${fmt(p.from, 3)}${p.peak != null ? " → " + fmt(p.peak, 3) : ""} → ${fmt(p.to, 3)}${p.unit ? " " + p.unit : ""}`).join("; ");
    out.push({ app: d.app, phase: a.name, element: a.element, video_start_s: a.start_s, video_end_s: a.end_s, delay_from_trigger_ms: a.delay_from_trigger_ms, duration_ms: a.duration_ms,
      properties: props, easing: a.easing, easing_css: a.easing_css, spring_damping: a.spring?.damping_ratio, spring_response_s: a.spring?.response_s, stagger_ms: a.stagger_ms, loop_period_ms: a.loop_period_ms, confidence: a.confidence, notes: a.notes });
  }
  return out;
}
function download(name, text, type) { const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); a.remove(); }
function exportCSV() {
  const rows = rowsForExport(); const cols = Object.keys(rows[0] || {});
  const q = v => v == null ? "" : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  download("reaction-animation-specs.csv", [cols.join(","), ...rows.map(r => cols.map(c => q(r[c])).join(","))].join("\n"), "text/csv");
}
function exportJSON() { download("reaction-animation-specs.json", JSON.stringify(DATA, null, 2), "application/json"); }

// ---------- APP VIEW ----------
let rafId = null;
function renderApp(main, d) {
  cancelAnimationFrame(rafId);
  const m = cycleMetrics(d);
  const grid = h("div", { class: "app-grid" });
  // player
  const video = h("video", { src: `video/${d.id}.mp4`, playsinline: "", muted: "", preload: "auto" });
  video.muted = true;
  const timeEl = h("span"), frameEl = h("span");
  let loopRange = null, speed = 1;
  const speedBtns = [0.1, 0.25, 0.5, 1].map(s => h("button", { "aria-pressed": String(s === 1), onclick: () => setSpeed(s) }, s + "×"));
  function setSpeed(s) { speed = s; video.playbackRate = s; speedBtns.forEach(b => b.setAttribute("aria-pressed", String(b.textContent === s + "×"))); }
  const playBtn = h("button", { onclick: () => video.paused ? video.play() : video.pause() }, "▶ Play");
  video.addEventListener("play", () => playBtn.textContent = "❚❚ Pause"); video.addEventListener("pause", () => playBtn.textContent = "▶ Play");
  const step = n => { video.pause(); video.currentTime = Math.max(0, Math.min(video.duration || 1e9, video.currentTime + n / FPS)); };
  const loopBtn = h("button", { "aria-pressed": "false", onclick: () => setLoop(loopRange ? null : [d.representative_cycle.start, d.representative_cycle.end], "cycle") }, "⟲ Loop cycle");
  function setLoop(r, kind) {
    loopRange = r; loopBtn.setAttribute("aria-pressed", String(!!r && kind === "cycle"));
    if (r) { video.currentTime = r[0]; video.play(); }
  }
  const player = h("div", { class: "player" },
    h("div", { class: "phone" }, video),
    h("div", { class: "controls" }, playBtn, h("button", { onclick: () => step(-1), title: "Back 1 frame (←)" }, "◀ 1f"), h("button", { onclick: () => step(1), title: "Forward 1 frame (→)" }, "1f ▶"), loopBtn),
    h("div", { class: "controls" }, h("span", { class: "muted", style: "font-size:12px" }, "Speed"), ...speedBtns),
    h("div", { class: "readout" }, timeEl, frameEl),

    if (n.includes("rotat")) return "r"; if (n.includes("opacity")) return "o"; return null; };
  const used = props.filter(p => kind(p.prop));
  if (!used.length) { shape.style.opacity = .35; cap.textContent = "no transform values to replicate"; return box; }
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));
  const state = pick => {
    const v = { s: 1, sx: null, sy: null, tx: 0, ty: 0, r: 0, o: 1 };
    for (const p of used) v[kind(p.prop)] = pick(p);
    return { transform: `translate(${clamp(v.tx, 60)}px, ${clamp(v.ty, 50)}px) rotate(${v.r}deg) scale(${v.sx ?? v.s}, ${v.sy ?? v.s})`, opacity: v.o };
  };
  const hasPeak = used.some(p => typeof p.peak === "number");
  const easing = cssEasing(a.easing_css) || "ease-out";
  // With a measured peak: ease-out into the peak at 60% of the duration, ease-in-out to settle.
  const kfs = hasPeak
    ? [{ ...state(p => p.from), offset: 0, easing: "cubic-bezier(.2,.7,.3,1)" },
       { ...state(p => typeof p.peak === "number" ? p.peak : p.to), offset: 0.6, easing: "ease-in-out" },
       { ...state(p => p.to), offset: 1 }]
    : [{ ...state(p => p.from), offset: 0, easing }, { ...state(p => p.to), offset: 1 }];
  const dur = Math.max(80, a.duration_ms || 300) * 2;
  const run = () => { if (!box.isConnected) return; shape.animate(kfs, { duration: dur, fill: "forwards" }).onfinish = () => setTimeout(run, 700); };
  setTimeout(run, 300);
  return box;
}

renderNav(); render();
</script>
