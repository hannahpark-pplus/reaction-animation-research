<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Selection Animations — Research</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --surface-2: #efeeea; --border: #dcdad4;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --series-1: #2a78d6; --series-1-soft: #cde2fb; --hold: #c9c7c0; --hi: #e34948; --accent: #0b0b0b;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #383835;
  --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --series-1: #3987e5; --series-1-soft: #184f95; --hold: #4a4945; --hi: #e66767; --accent: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #383835;
    --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-1-soft: #184f95; --hold: #4a4945; --hi: #e66767; --accent: #fff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav button { border: 1px solid var(--border); background: var(--surface-1); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
nav button[aria-pressed="true"] { background: var(--accent); color: var(--surface-1); border-color: var(--accent); }
#themeBtn { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
main { padding: 28px 28px 80px; max-width: 1240px; margin: 0 auto; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
h3 { font-size: 16px; margin: 0 0 12px; }
.lede { font-size: 16px; color: var(--text-secondary); max-width: 70ch; margin: 0 0 22px; }
.muted { color: var(--text-muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* overview */
.takeaways { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 12px; margin-bottom: 18px; }
.takeaways .card { padding: 16px; }
.takeaways b { display: block; font-size: 24px; letter-spacing: -.01em; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.takeaways p { margin: 0; font-size: 13.5px; color: var(--text-secondary); }
.ov-list { display: grid; gap: 8px; }
.ov-row { display: grid; grid-template-columns: 120px 1fr 240px; gap: 16px; align-items: center; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
.ov-row:hover { background: var(--surface-2); }
.ov-row .name { font-weight: 650; }
.ov-row .style { color: var(--text-secondary); font-size: 14px; }
.ov-bar { display: flex; align-items: center; gap: 8px; }
.ov-bar i { display: block; height: 14px; border-radius: 4px; background: var(--series-1); }
.ov-bar span { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
@media (max-width: 760px) { .ov-row { grid-template-columns: 1fr; gap: 4px; } }
.scale-note { font-size: 12px; color: var(--text-muted); margin-top: 10px; }

/* app view */
.app-head { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
.app-head .big { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.app-head .lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.app-head .style-big { font-size: 22px; font-weight: 650; line-height: 1.2; }
.app-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .app-grid { grid-template-columns: 1fr; } }
.player { position: sticky; top: 80px; }
.phone { background: #000; border-radius: 26px; padding: 7px; width: fit-content; }
.phone video { height: min(560px, calc(100vh - 230px)); display: block; border-radius: 20px; aspect-ratio: 1290/2796; background: #000; }
.zoom { position: relative; overflow: hidden; border-radius: 16px; background: #000; width: 400px; max-width: 100%; }
.zoom video { position: absolute; max-width: none; }
.zoom, .phone { cursor: pointer; position: relative; }
.play-ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 34px; color: #fff; background: rgba(0,0,0,.35); border-radius: inherit; }
.ctrl { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.ctrl button { border: 1px solid var(--border); background: var(--surface-1); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.ctrl button[aria-pressed="true"] { background: var(--accent); color: var(--surface-1); border-color: var(--accent); }
.ctrl .ms { font-family: var(--mono); font-size: 13px; margin-left: auto; }
.cap { font-size: 12px; color: var(--text-muted); margin-top: 6px; max-width: 280px; }

.facts { display: grid; gap: 10px; margin-bottom: 16px; }
.fact { display: grid; grid-template-columns: 110px 1fr; gap: 12px; font-size: 14px; }
.fact b { color: var(--text-muted); font-weight: 600; font-size: 13px; }

.tl svg { width: 100%; display: block; overflow: visible; }
.tl text { font-size: 11px; fill: var(--text-muted); }
.tl .grid { stroke: var(--border); }
.tl .bar { fill: var(--series-1); }
.tl .bar.hold { fill: var(--hold); }
.tl .inst { fill: var(--series-1); }
.tl .num { font-size: 11px; fill: #fff; font-weight: 700; }
.tl .ph { stroke: var(--hi); stroke-width: 2; }

.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--series-1); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.step .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.step .title { font-weight: 650; }
.step .time { font-family: var(--mono); font-size: 13px; color: var(--text-secondary); }
.step .what { color: var(--text-secondary); margin-top: 2px; }
.ease { display: inline-flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px; padding: 3px 9px 3px 4px; border-radius: 999px; background: var(--surface-2); }
.ease svg { width: 22px; height: 22px; }
.ease .css { font-family: var(--mono); color: var(--text-muted); font-size: 11.5px; }
.note { margin-top: 16px; font-size: 14px; color: var(--text-secondary); background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.foot { margin-top: 30px; font-size: 13px; color: var(--text-muted); max-width: 80ch; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 50; display: none; max-width: 260px; }
</style>
</head>
<body>
<header>
  <h1>Reaction animations</h1>
  <nav id="nav"></nav>
  <button id="themeBtn" title="Toggle light/dark">◐</button>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script>
const R = /*RECIPES*/{};
const APPS = /*APPS*/[];
const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};
const S = (tag, attrs = {}) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
const tip = $("#tip");
const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 14 + "px"; };
const hideTip = () => tip.style.display = "none";
$("#themeBtn").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };

let current = location.hash.slice(1) || "overview";
function renderNav() {
  const nav = $("#nav"); nav.innerHTML = "";
  for (const [id, label] of [["overview", "Overview"], ...APPS.map(a => [a.id, a.app])])
    nav.append(h("button", { "aria-pressed": String(id === current), onclick: () => go(id) }, label));
}
function go(id) { location.hash = id; }
addEventListener("hashchange", () => { current = location.hash.slice(1) || "overview"; renderNav(); render(); scrollTo(0, 0); });
function render() {
  const main = $("#main"); main.innerHTML = "";
  const app = APPS.find(a => a.id === current);
  app ? renderApp(main, app) : renderOverview(main);
}

// small easing glyph
function easeIcon(key) {
  const svg = S("svg", { viewBox: "0 0 22 22" });
  svg.append(S("rect", { x: 1, y: 1, width: 20, height: 20, rx: 5, fill: "var(--surface-1)" }));
  const paths = {
    "ease-out": "M4 18 C 6 6, 10 4, 18 4", "ease-in": "M4 18 C 12 18, 16 16, 18 4", "ease-in-out": "M4 18 C 11 18, 11 4, 18 4",
    "overshoot": "M4 18 C 7 0, 12 1, 18 6", "linear": "M4 18 L 18 4", "instant": "M4 18 L 11 18 L 11 4 L 18 4", "hold": "M4 11 L 18 11" };
  svg.append(S("path", { d: paths[key] || paths.linear, fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linecap": "round" }));
  if (key === "overshoot") svg.append(S("line", { x1: 3, x2: 19, y1: 6, y2: 6, stroke: "var(--border)", "stroke-dasharray": "2 2" }));
  return svg;
}
const fmtT = s => s.t0 === s.t1 ? `at ${s.t0} ms` : `${s.t0}–${s.t1} ms`;

function renderOverview(main) {
  main.append(h("h2", {}, "Reaction selection animations"),
    h("p", { class: "lede" }, "Measured frame by frame from 7 apps."));
  const tk = h("div", { class: "takeaways" });
  for (const t of R.takeaways) tk.append(h("div", { class: "card" }, h("b", {}, t.big), h("p", {}, t.text)));
  main.append(tk);

  const list = h("div", { class: "ov-list" });
  const max = Math.max(...APPS.map(a => R.apps[a.id].total_ms));
  [...APPS].sort((a, b) => R.apps[a.id].total_ms - R.apps[b.id].total_ms).forEach(a => {
    const r = R.apps[a.id];
    list.append(h("div", { class: "ov-row", onclick: () => go(a.id), title: "Open the recipe" },
      h("div", { class: "name" }, a.app), h("div", { class: "style" }, r.style),
      h("div", { class: "ov-bar" }, h("i", { style: `width:${(r.total_ms / max * 150).toFixed(0)}px` }), h("span", {}, r.total_ms + " ms"))));
  });
  main.append(h("div", { class: "card" }, h("h3", {}, "Total length"), list));
  main.append(h("p", { class: "foot" }, "Times ±17 ms (60 fps). Sizes in pt on a 430 pt-wide iPhone."));
}

function renderApp(main, app) {
  const r = R.apps[app.id];
  main.append(h("h2", {}, app.app));
  main.append(h("div", { class: "app-head" },
    h("div", {}, h("div", { class: "big" }, r.total_ms + " ms"), h("div", { class: "lbl" }, "total")),
    h("div", { style: "flex:1;min-width:260px" }, h("div", { class: "style-big" }, r.style), h("div", { class: "lbl" }, "style"))));

  const grid = h("div", { class: "app-grid" });
  // player — loops just the selection moment
  const video = h("video", { src: `video/${app.id}.mp4`, playsinline: "", muted: "", autoplay: "", preload: "auto" });
  video.muted = true;
  const [c0, c1] = r.clip;
  const msEl = h("span", { class: "ms" });
  let speed = 1;
  const speedBtns = [1, 0.5, 0.25, 0.1].map(s => h("button", { "aria-pressed": String(s === speed), onclick: () => { speed = s; video.playbackRate = s; speedBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s == s))); }, "data-s": s }, s + "×"));
  const playIcon = h("div", { class: "play-ov", html: "&#9654;" });
  let userPaused = false;
  const toggle = () => { userPaused = !video.paused; userPaused ? video.pause() : video.play(); };
  video.addEventListener("loadedmetadata", () => { video.currentTime = c0; video.playbackRate = speed; });
  video.addEventListener("canplay", () => { if (!video.dataset.started) { video.dataset.started = 1; video.play().catch(() => {}); } });
  // zoomed view: crop the phone screen to this app's action area (focus rect in pt on a 430 × 932 pt screen)
  const [fx, fy, fw, fh] = r.focus, ZW = 400, k = ZW / fw;
  const frame = h("div", { onclick: toggle, title: "Click to play / pause" });
  const setView = zoomed => {
    frame.innerHTML = ""; viewBtns.forEach(b => b.setAttribute("aria-pressed", String((b.dataset.v === "zoom") === zoomed)));
    if (zoomed) { video.removeAttribute("style"); Object.assign(video.style, { width: 430 * k + "px", height: 932 * k + "px", left: -fx * k + "px", top: -fy * k + "px" });
      frame.className = "zoom"; frame.style.height = fh * k + "px"; frame.append(video, playIcon); }
    else { video.removeAttribute("style"); frame.className = "phone"; frame.style.height = ""; frame.append(video, playIcon); }
    if (video.readyState) video.play().catch(() => {});
  };
  const viewBtns = [h("button", { "data-v": "zoom", onclick: () => setView(true) }, "Zoom"), h("button", { "data-v": "full", onclick: () => setView(false) }, "Full")];
  setView(true);
  grid.append(h("div", { class: "player" }, frame,
    h("div", { class: "ctrl" }, ...viewBtns, h("span", { style: "width:8px" }), ...speedBtns, msEl)));

  const right = h("div");
  right.append(h("div", { class: "facts" },
    h("div", { class: "fact" }, h("b", {}, "Same for all"), h("span", {}, r.same_for_all)),
    h("div", { class: "fact" }, h("b", {}, "Size"), h("span", {}, r.icon_size))));

  // timeline
  const tl = h("div", { class: "card tl" });
  const W = 760, L = 28, Rr = 20, rowH = 26, steps = r.steps, H = steps.length * rowH + 26, T = r.total_ms;
  const x = ms => L + (W - L - Rr) * ms / T;
  const svg = S("svg", { viewBox: `0 0 ${W} ${H}` });
  const stepMs = T > 700 ? 100 : 50;
  for (let ms = 0; ms <= T; ms += stepMs) { svg.append(S("line", { x1: x(ms), x2: x(ms), y1: 0, y2: H - 18, class: "grid" })); const t = S("text", { x: x(ms), y: H - 4, "text-anchor": "middle" }); t.textContent = ms; svg.append(t); }
  if (T % stepMs) { const t = S("text", { x: x(T), y: H - 4, "text-anchor": "middle", style: "font-weight:700;fill:var(--text-primary)" }); t.textContent = T; svg.append(t); }
  steps.forEach((s, i) => {
    const y = i * rowH + 4;
    const g = S("g");
    const lab = S("text", { x: 4, y: y + 14, style: "font-weight:700;fill:var(--text-secondary)" }); lab.textContent = i + 1; g.append(lab);
    if (s.t0 === s.t1) {
      const cx = x(s.t0); g.append(S("path", { d: `M${cx} ${y + 2} l8 8 l-8 8 l-8 -8 z`, class: "inst" }));
    } else g.append(S("rect", { x: x(s.t0), y: y + 3, width: Math.max(3, x(s.t1) - x(s.t0)), height: 15, rx: 4, class: "bar" + (s.ease === "hold" ? " hold" : "") }));
    const hit = S("rect", { x: 0, y, width: W, height: rowH, fill: "transparent" });
    hit.addEventListener("mousemove", e => showTip(e, `<b>${i + 1}. ${s.title}</b><br>${fmtT(s)}<br>${R.easings[s.ease]?.label || ""}`)); hit.addEventListener("mouseleave", hideTip);
    g.append(hit); svg.append(g);
  });
  const ph = S("line", { y1: 0, y2: H - 18, class: "ph" }); svg.append(ph);
  tl.append(svg);
  right.append(tl);

  // step cards
  const ol = h("ol", { class: "steps" });
  steps.forEach((s, i) => {
    const e = R.easings[s.ease] || {};
    ol.append(h("li", { class: "step" }, h("div", { class: "n" }, i + 1), h("div", {},
      h("div", { class: "top" }, h("span", { class: "title" }, s.title), h("span", { class: "time" }, fmtT(s) + (s.t0 !== s.t1 ? ` · ${s.t1 - s.t0} ms` : ""))),
      s.what ? h("div", { class: "what" }, s.what) : null,
      h("div", { class: "ease" }, easeIcon(s.ease), h("b", {}, e.label), h("span", { class: "muted" }, e.desc), e.css ? h("span", { class: "css" }, e.css) : null))));
  });
  right.append(ol);
  if (r.variant) right.append(h("div", { class: "note" }, r.variant));
  grid.append(right);
  main.append(grid);

  // loop + playhead
  let raf;
  const tick = () => {
    if (!video.isConnected) return cancelAnimationFrame(raf);
    if (video.currentTime >= c1 || video.currentTime < c0 - 0.05) video.currentTime = c0;
    const ms = Math.round((video.currentTime - r.zero_s) * 1000);
    msEl.textContent = (ms >= 0 ? "+" : "") + ms + " ms";
    if (video.paused && !userPaused && video.readyState >= 3 && document.visibilityState === "visible" && !video.dataset.trying) { video.dataset.trying = 1; video.play().catch(() => {}).finally(() => delete video.dataset.trying); }
    playIcon.style.display = video.paused ? "flex" : "none";
    const vis = ms >= 0 && ms <= T; ph.style.display = vis ? "" : "none";
    if (vis) { ph.setAttribute("x1", x(ms)); ph.setAttribute("x2", x(ms)); }
    raf = requestAnimationFrame(tick);
  };
  tick();
}
renderNav(); render();
</script>
</body>
</html>
