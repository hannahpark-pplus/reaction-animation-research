<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Animation Research — Motion Spec</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --surface-2: #efeeea;
  --border: #dcdad4;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --series-1: #2a78d6;
  --series-1-soft: #cde2fb;
  --ref: #9a9993;
  --accent: #0b0b0b;
  --hi: #e34948;
  --ok: #0ca30c; --warn: #b07800; --low: #d03b3b;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-1-soft: #184f95; --ref: #77766f; --accent: #fff; --hi: #e66767;
    --warn: #c98500;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #111110; --surface-1: #1a1a19; --surface-2: #242422; --border: #383835;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --series-1: #3987e5; --series-1-soft: #184f95; --ref: #77766f; --accent: #fff; --hi: #e66767;
  --warn: #c98500;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .sub { color: var(--text-muted); font-size: 12px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav button, .chip { border: 1px solid var(--border); background: var(--surface-1); padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 13px; }
nav button[aria-pressed="true"] { background: var(--accent); color: var(--surface-1); border-color: var(--accent); }
#themeBtn { border: 1px solid var(--border); background: none; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
main { padding: 20px 24px 60px; max-width: 1500px; margin: 0 auto; }
.muted { color: var(--text-muted); }
.sec { color: var(--text-secondary); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
h2 { font-size: 20px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 0 0 8px; }
h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 14px 0 6px; font-weight: 600; }

/* App view */
.app-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .app-grid { grid-template-columns: 1fr; } }
.player { position: sticky; top: 80px; }
.phone { background: #000; border-radius: 28px; padding: 8px; width: fit-content; margin: 0 auto; }
.phone video { height: calc(100vh - 250px); min-height: 360px; max-width: 100%; display: block; border-radius: 22px; aspect-ratio: 1290/2796; background:#000; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.controls button { border: 1px solid var(--border); background: var(--surface-1); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--accent); color: var(--surface-1); }
.readout { font-family: var(--mono); font-size: 13px; margin-top: 8px; display: flex; justify-content: space-between; }
.kbd { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

.timeline { position: relative; user-select: none; }
.tl-svg { width: 100%; display: block; overflow: visible; cursor: pointer; }
.tl-svg text { font-size: 11px; fill: var(--text-secondary); }
.tl-svg .grid { stroke: var(--border); stroke-width: 1; }
.tl-svg .bar { fill: var(--series-1); rx: 4; }
.tl-svg .bar.dim { fill: var(--series-1-soft); }
.tl-svg .marker { stroke: var(--hi); stroke-width: 2; }
.tl-svg .playhead { stroke: var(--text-primary); stroke-width: 1.5; }
.tl-svg .row:hover .bar { filter: brightness(1.15); }
.tl-svg .lbl { fill: var(--text-primary); font-size: 12px; }

.summary { font-size: 15px; color: var(--text-secondary); max-width: 80ch; margin: 6px 0 14px; }
.kv { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
.kv div b { display: block; font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kv div span { font-size: 12px; color: var(--text-muted); }

.anims { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 14px; margin-top: 14px; }
.anim h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; font-weight: 600; }
.badge.high { color: var(--ok); } .badge.medium { color: var(--warn); } .badge.low { color: var(--low); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 4px; }
.stats div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.stats b { display: block; font-family: var(--mono); font-size: 15px; }
.stats span { font-size: 11px; color: var(--text-muted); }
.easing { white-space: pre-line; font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin-top: 6px; word-break: break-all; }
.row-btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.row-btns button { border: 1px solid var(--border); background: var(--surface-1); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.row-btns button:hover { border-color: var(--text-secondary); }
.viz-pair { display: grid; grid-template-columns: 1fr 140px; gap: 10px; margin-top: 10px; align-items: stretch; }
.chart svg { width: 100%; display: block; overflow: visible; }
.chart svg text { font-size: 10px; fill: var(--text-muted); }
.chart .axis { stroke: var(--border); }
.chart .meas { fill: none; stroke: var(--series-1); stroke-width: 2; }
.chart .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.chart .fit { fill: none; stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 4 3; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--series-1); vertical-align: middle; margin-right: 4px; }
.legend i.fit { border-top: 1.5px dashed var(--ref); }
.replica { background: var(--surface-2); border-radius: 10px; position: relative; overflow: hidden; min-height: 140px; display:flex; align-items:center; justify-content:center; }
.replica .shape { width: 44px; height: 44px; border-radius: 50%; background: var(--series-1); display:flex; align-items:center; justify-content:center; color:#fff; font-size: 20px; }
.replica .cap { position: absolute; bottom: 4px; left: 6px; right: 6px; font-size: 10px; color: var(--text-muted); text-align: center; }
.notes { font-size: 12.5px; color: var(--text-secondary); margin-top: 8px; }
.gallery { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.gallery figure { margin: 0; flex: 0 0 auto; max-width: 260px; cursor: pointer; }
.gallery img { max-height: 260px; max-width: 260px; border-radius: 8px; border: 1px solid var(--border); display: block; }
.gallery figcaption { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
ul.tight { margin: 4px 0; padding-left: 18px; } ul.tight li { margin: 3px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 1200px) { .two { grid-template-columns: 1fr; } }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 50; display: none; max-width: 280px; }
.tip b { font-family: var(--mono); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--surface-1); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.ov-table td, .ov-table th { white-space: nowrap; }
.ov-table tr.click { cursor: pointer; } .ov-table tr.click:hover td { background: var(--surface-2); }
.method { font-size: 13px; color: var(--text-secondary); }
.method li { margin: 4px 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Reaction Animation Research — Motion Spec</h1>
    <div class="sub">Measured frame-by-frame from 60 fps iPhone screen recordings · units: pt (1 pt = 3 px) and ms</div>
  </div>
  <nav id="nav"></nav>
  <button id="themeBtn" title="Toggle light/dark">◐</button>
</header>
<main id="main"></main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

.1}, "elements": [{"name": "Reaction tray", "w_pt": 328, "h_pt": 52, "radius_pt": 26, "fill": "#F8F8FA", "notes": "Pill, x 51-379 pt (centred on 430-pt screen), top 620 pt, bottom ~672 pt, overlapping the bottom of the photo. Soft shadow ~3-5 pt below (244->253 grey). Opaque at rest."}, {"name": "Reaction emoji (x7)", "w_pt": 40, "h_pt": 40, "radius_pt": 20, "fill": "animated sticker", "notes": "Order: Like, Love, Care, Haha, Wow, Sad, Angry. Centres x = 77, 123, 169, 215, 261, 307, 353 pt (46 pt pitch, 6 pt gaps), y = 646 pt. 6 pt inset from the tray ends."}, {"name": "Reaction name tooltip", "w_pt": 38, "h_pt": 20, "radius_pt": 10, "fill": "rgba(0,0,0,~0.4)", "notes": "White ~13 pt semibold text (e.g. 'Love'), centred 44 pt above the touched emoji (y ~592-612 pt), ~8 pt above the tray."}, {"name": "Like button press highlight", "w_pt": 137, "h_pt": 33, "radius_pt": 7, "fill": "#E3E3E3", "notes": "x 3-140 pt, y 700-733 pt. Covers the Like third of the action row."}, {"name": "Action row / helper text", "w_pt": 430, "h_pt": 33, "radius_pt": 0, "fill": "#FFFFFF", "notes": "'Slide finger across' -> 'Tap to select a reaction', grey ~15 pt, centred, at the action row's y (~716 pt)."}], "animations": [{"id": "press", "name": "Like button press highlight", "element": "Like button press highlight", "start_s": 2.547, "end_s": 2.68, "duration_ms": 133, "delay_from_trigger_ms": 0, "properties": [{"prop": "background", "from": "#FEFEFE", "to": "#E3E3E3", "unit": ""}, {"prop": "opacity", "from": 0, "to": 1, "unit": "", "notes": "Instant (1 frame) on touch-down. On long-press it vanishes instantly on the frame the tray starts (2.680). On a plain tap (un-react) it holds until release, then fades out over ~83 ms."}], "easing": "step on; long-press: step off; tap: ease-in fade-out (227->230->233->238->245->254 grey level over 5 frames)", "easing_css": "on: steps(1); tap fade-out: 83ms cubic-bezier(0.5,0,1,1)", "spring": null, "stagger_ms": 0, "loop_period_ms": null, "samples": {"prop": "highlight grey level (8-bit) during un-react tap at 5.260 s", "unit": "0-255", "points": [[0, 227], [17, 227], [33, 227], [50, 227], [67, 230], [83, 233], [100, 238], [117, 245], [133, 254]]}, "confidence": "high", "notes": "Hold before the tray opens varies across the 6 long-presses (133, 67, 50, 83, 83, 83 ms, measured from highlight-on to tray start). So highlight-on is probably not the real touch-down. iOS scroll views delay the highlight. The real long-press threshold is likely ~250-400 ms but cannot be measured."}, {"id": "row-swap-in", "name": "Action row swaps to helper text", "element": "Action row / helper text", "start_s": 2.68, "end_s": 2.68, "duration_ms": 0, "delay_from_trigger_ms": 133, "properties": [{"prop": "content", "from": "Like / Comment / Share", "to": "'Slide finger across' (grey, centred)", "unit": ""}, {"prop": "content", "from": "'Slide finger across'", "to": "'Tap to select a reaction'", "unit": "", "notes": "Swaps at ~2.963 s, about 283 ms after the tray starts. Probably fires when the finger lifts with no reaction under it."}], "easing": "instant (no cross-fade)", "easing_css": "steps(1)", "spring": null, "stagger_ms": 0, "loop_period_ms": null, "samples": null, "confidence": "high", "notes": "The row snaps back to Like/Comment/Share, with the new reaction label, on the release frame."}, {"id": "tray-in", "name": "Reaction tray appears", "element": "Reaction tray", "start_s": 2.68, "end_s": 2.847, "duration_ms": 167, "delay_from_trigger_ms": 133, "properties": [{"prop": "opacity", "from": 0.4, "to": 1, "unit": "", "notes": "Estimated from the tray-gap pixel over the dark photo: 0.43, 0.59, 0.81, 0.93, 0.99, 1.0 at 0-83 ms. Real start is ~0 one frame earlier."}, {"prop": "translateY (top edge)", "from": 22, "peak": -1.5, "to": 0, "unit": "pt", "notes": "Top edge 642 -> 631 -> 624 -> 620.7 -> 619.0 -> 618.5 (overshoot) -> 619.3 -> 620 pt"}, {"prop": "width", "from": 328, "to": 328, "unit": "pt", "notes": "Full width from the first f nstant swaps; highlight ease-in fade", "easing_css": "83ms cubic-bezier(0.5,0,1,1)", "spring": null, "stagger_ms": 0, "loop_period_ms": null, "samples": null, "confidence": "high", "notes": "No fly-out or other animation on removal. The summary icon goes away instantly too."}], "keyframe_images": [{"t": 2.58, "file": "img/v1_press.png", "caption": "Long-press: grey highlight on Like (instant)"}, {"t": 2.697, "file": "img/v1_tray-entering.png", "caption": "Tray 17 ms in: translucent, low, emojis at ~0.58x; helper text already swapped"}, {"t": 2.797, "file": "img/v1_tray-peak.png", "caption": "Tray/emoji overshoot peak (emojis 1.03x, tray 1.5 pt high)"}, {"t": 3.745, "file": "img/v1_tap-tooltip.png", "caption": "Touch on Love: 'Love' tooltip appears, emoji not scaled"}, {"t": 3.762, "file": "img/v1_release.png", "caption": "Release: tray drops/fades, others shrink, heart lifts; button reads 'Love' instantly"}, {"t": 3.862, "file": "img/v1_fly-apex.png", "caption": "Fly-out apex (117 ms): 85 pt above row, 0.9x, drifting left"}, {"t": 4.095, "file": "img/v1_after.png", "caption": "Final: 'Love' label, 'You and 66 others'"}], "observations": ["All six fly-outs share one 333 ms timeline and end at the same point (~88, 652 pt), whatever the starting slot. Horizontal speed scales with distance (Love travels 35 pt, Angry 265 pt), and the apex height and timing (561 pt at 117 ms) are identical. A designer can reuse one motion path and change only P0.", "The fly-out end point is not the Like button icon (~20, 716 pt). The emoji shrinks to zero just above the summary row near x ≈ 88 pt.", "Text and state changes are all instant cuts with no cross-fades: action row ↔ helper text, the button label, the count text, and the summary icons.", "The selected emoji does not grow while touched in this tap-to-select flow. Only the name tooltip appears. The 1.08x pop happens after release.", "Tray and emoji entrance share one spring (no stagger). The emojis start at ~0.4x and ~35 pt lower, function sampleChart(a) {
  const raw = a.samples?.points || [];
  const W = 280, H = 140, L = 34, B = 18, T = 8, R = 6;
  const svg = S("svg", { viewBox: `0 0 ${W} ${H}` });
  const rgb = raw.filter(p => Array.isArray(p) && typeof p[1] === "string" && /^\s*\d+\s*,\s*\d+\s*,\s*\d+\s*$/.test(p[1]));
  if (rgb.length >= 2) { // color samples → swatch strip
    const wrap = h("div"); const strip = h("div", { style: "display:flex;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--border)" });
    for (const p of rgb) { const c = h("div", { style: `flex:1;background:rgb(${p[1]})` }); c.addEventListener("mousemove", e => showTip(e, `<b>${p[0]} ms</b> · rgb(${p[1]})`)); c.addEventListener("mouseleave", hideTip); strip.append(c); }
    wrap.append(h("div", { class: "muted", style: "font-size:10px;margin-bottom:4px" }, a.samples.prop), strip, h("div", { class: "legend" }, `${rgb[0][0]} ms → ${rgb[rgb.length - 1][0]} ms, measured per frame`));
    return wrap;
  }
  const pts = raw.filter(p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]));
  if (pts.length < 2) { const t = S("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }); t.textContent = "No per-frame samples recorded"; svg.append(t); return svg; }
  const prop = (a.properties || []).find(p => p.prop === a.samples.prop) || {};
  const tmin = Math.min(0, ...pts.map(p => p[0]));
  const dur = a.duration_ms || Math.max(...pts.map(p => p[0]));
  let fit = null;
  const from = typeof prop.from === "number" ? prop.from : pts[0][1], to = typeof prop.to === "number" ? prop.to : pts[pts.length - 1][1];
  if (a.spring && a.spring.damping_ratio != null && a.spring.response_s) { const f = springFn(a.spring.damping_ratio, a.spring.response_s); fit = t => from + (to - from) * f(t / 1000); }
  else { const f = bezierFn(a.easing_css); if (f) fit = t => from + (to - from) * f(Math.min(1, t / dur)); }
  const tmax = Math.max(dur, ...pts.map(p => p[0]));
  const fitPts = fit ? Array.from({ length: 61 }, (_, i) => [i / 60 * tmax, fit(i / 60 * tmax)]).filter(p => Number.isFinite(p[1])) : [];
  const ys = [...pts.map(p => p[1]), ...fitPts.map(p => p[1])]; let ymin = Math.min(...ys), ymax = Math.max(...ys); if (ymin === ymax) { ymin -= 1; ymax += 1; }
  const pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
  const x = t => L + (W - L - R) * (t - tmin) / (tmax - tmin), y = v => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  svg.append(S("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, class: "axis" }), S("line", { x1: L, x2: L, y1: T, y2: H - B, class: "axis" }));
  [ymin + pad, ymax - pad].forEach(v => { const t = S("text", { x: L - 4, y: y(v) + 3, "text-anchor": "end" }); t.textContent = fmt(+v.toFixed(2), 2); svg.append(t); });
  [tmin, tmax].forEach((v, i) => { const t = S("text", { x: x(v), y: H - 4, "text-anchor": i ? "end" : "start" }); t.textContent = Math.round(v) + " ms"; svg.append(t); });
  const lab = S("text", { x: L + 4, y: T + 8 }); lab.textContent = `${a.samples.prop}${a.samples.unit ? " (" + a.samples.unit + ")" : ""}`; svg.append(lab);
  if (fitPts.length) svg.append(S("path", { d: "M" + fitPts.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("L"), class: "fit" }));
  svg.append(S("path", { d: "M" + pts.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("L"), class: "meas" }));
  if (pts.length <= 40) pts.forEach(p => svg.append(S("circle", { cx: x(p[0]), cy: y(p[1]), r: 2.5, class: "dot" })));
  const cross = S("line", { y1: T, y2: H - B, stroke: "var(--text-muted)", "stroke-width": 1, style: "display:none" }); svg.append(cross);
  const hit = S("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" }); svg.append(hit);
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(); const t = tmin + ((e.clientX - r.left) / r.width * W - L) / (W - L - R) * (tmax - tmin);
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    cross.style.display = ""; cross.setAttribute("x1", x(best[0])); cross.setAttribute("x2", x(best[0]));
    showTip(e, `<b>${Math.round(best[0])} ms</b> · measured ${a.samples.prop} <b>${fmt(+best[1].toFixed(3), 3)}</b>${fit ? `<br>fitted curve ${fmt(+fit(best[0]).toFixed(3), 3)}` : ""}`);
  });
  hit.addEventListener("mouseleave", () => { cross.style.display = "none"; hideTip(); });
  const wrap = h("div"); wrap.append(svg, h("div", { class: "legend" }, h("span", {}, h("i"), "measured"), fit ? h("span", {}, h("i", { class: "fit" }), "fitted easing") : null));
  return wrap;
}

// Basic replica — animates an abstract shape using the measured from/peak/to values
function replica(a) {
  const box = h("div", { class: "replica", title: "Abstract replica of this phase using the measured values (slowed 2×)" });
  const shape = h("div", { class: "shape" }); const cap = h("div", { class: "cap" }, "replica · 0.5× speed");
  box.append(shape, cap);
  const props = (a.properties || []).filter(p => typeof p.from === "number" && typeof p.to === "number");
  const kind = n => { n = n.toLowerCase();
    if (n === "scale") return "s"; if (n === "scalex") return "sx"; if (n === "scaley") return "sy";
    if (n.includes("translatex") || n === "x") return "tx"; if (n.includes("translatey") || n === "y") return "ty";
    if (n.includes("rotat")) return "r"; if (n.includes("opacity")) return "o"; return null; };
  const used = props.filter(p => kind(p.prop));
  if (!used.length) { shape.style.opacity = .35; cap.textContent = "no transform values to replicate"; return box; }
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));
  const state = pick => {
    const v = { s: 1, sx: null, sy: null, tx: 0, ty: 0, r: 0, o: 1 };
    for (const p of used) v[kind(p.prop)] = pick(p);
    return { transform: `translate(${clamp(v.tx, 60)}px, ${clamp(v.ty, 50)}px) rotate(${v.r}deg) scale(${v.sx ?? v.s}, ${v.sy ?? v.s})`, opacity: v.o };
  };
  const hasPeak = used.some(p => typeof p.peak === "number");
  const easing = cssEasing(a.easing_css) || "ease-out";
  // With a measured peak: ease-out into the peak at 60% of the duration, ease-in-out to settle.
  const kfs = hasPeak
    ? [{ ...state(p => p.from), offset: 0, easing: "cubic-bezier(.2,.7,.3,1)" },
       { ...state(p => typeof p.peak === "number" ? p.peak : p.to), offset: 0.6, easing: "ease-in-out" },
       { ...state(p => p.to), offset: 1 }]
    : [{ ...state(p => p.from), offset: 0, easing }, { ...state(p => p.to), offset: 1 }];
  const dur = Math.max(80, a.duration_ms || 300) * 2;
  const run = () => { if (!box.isConnected) return; shape.animate(kfs, { duration: dur, fill: "forwards" }).onfinish = () => setTimeout(run, 700); };
  setTimeout(run, 300);
  return box;
}

renderNav(); render();
</script>
